[project]
name = "grc-insight"
version = "0.1.0"
description = "GRC Weekly Report Pipeline - Automated data extraction and report generation from Inbenta API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "click>=8.1.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Streamlit configuration
[tool.streamlit]
[tool.streamlit.general]
email = ""

[tool.streamlit.browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[tool.streamlit.server]
headless = true
port = 8501
address = "localhost"
